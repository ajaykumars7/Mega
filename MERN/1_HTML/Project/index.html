<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Project</title>
    <style>
        .profile{
            border: 2px solid black;
            border-radius: 25px;
            height: 40px;
            width: 40px;
        }
        nav, footer{
            background-color: navajowhite;
            padding: 10px;
        }
        .con1, .con2, .con3{
            height: 500px;
        }
        .con1{
            background-color: rgb(239, 69, 69);
        }
        .con2{
            background-color: rgb(19, 223, 255);
        }
        .con3{
            background-color: rgb(155  , 241, 155);
        }

    </style>
</head>
<body>
    <header>
        <nav>
            <div>
                <ul class="navlinks">
                    <li>Home</li>
                    <li>Contact</li>
                    <li>Project</li>
                    <li ><img src="./images.jpg" alt="Profile" class="profile" ></li>
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <section>
            <div class="con1"></div>
            <div class="con2"></div>
            <div class="con3"></div>
        </section>
    </main>
    <footer>
        <p>Copyright &copy; 2021 My Website</p>
        <p>All Rights Reserved</p>
        <p>Terms & Conditions</p>
        <p>Privacy Policy</p>
        <p>Contact Us</p>
        <p>Feedback</p>
        <p>Social Media Icons</p>
        <p>Back to Top</p>
    </footer>
</body>
</html>
